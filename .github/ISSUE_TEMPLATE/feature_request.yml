name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user problem should EffChat solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and its user workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which existing EffChat or platform capability did you consider?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request fits a lightweight, self-hosted workbench.
          required: true
        - label: I have not included private deployment details or real user data.
          required: true

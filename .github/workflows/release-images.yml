name: Release container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag ancestry and completed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          scripts/verify-release-ref.sh

  build:
    name: Build ${{ matrix.component.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component:
          - name: backend
            dockerfile: backend/Dockerfile
            image: effchat-backend
          - name: web
            dockerfile: frontend/Dockerfile
            image: effchat-web
          - name: py-extractor
            dockerfile: py-extractor/Dockerfile
            image: effchat-py-extractor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/huoguojun123/${{ matrix.component.image }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component.image }}
          tags: type=raw,value=staging-${{ github.sha }}
          flavor: latest=false
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: BUILD_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

  promote:
    name: Promote release manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote all images after successful builds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_TAG: staging-${{ github.sha }}
        run: |
          set -euo pipefail
          for image in effchat-backend effchat-web effchat-py-extractor; do
            ghcr_source="ghcr.io/huoguojun123/${image}:${SOURCE_TAG}"
            dockerhub_source="${DOCKERHUB_USERNAME}/${image}:${SOURCE_TAG}"
            docker buildx imagetools create \
              --tag "ghcr.io/huoguojun123/${image}:${RELEASE_TAG}" \
              --tag "ghcr.io/huoguojun123/${image}:sha-${GITHUB_SHA}" \
              "${ghcr_source}"
            docker buildx imagetools create \
              --tag "${DOCKERHUB_USERNAME}/${image}:${RELEASE_TAG}" \
              --tag "${DOCKERHUB_USERNAME}/${image}:sha-${GITHUB_SHA}" \
              "${dockerhub_source}"
          done

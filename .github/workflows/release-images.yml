name: Release container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag ancestry and completed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) echo "release workflow only accepts v* tags" >&2; exit 1 ;;
          esac

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "release tag ${GITHUB_REF_NAME} does not point to a commit reachable from origin/main" >&2
            exit 1
          fi

          required_checks=(
            "Backend"
            "Frontend"
            "Python extractor"
            "PostgreSQL integration"
            "Compose and containers"
            "Gitleaks"
          )
          check_runs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"

          for required in "${required_checks[@]}"; do
            matching="$(printf '%s\n' "${check_runs}" | awk -F '\t' -v expected="${required}" \
              '$1 == expected || $1 == "CI / " expected || $1 == "Secret scan / " expected')"
            if [ -z "${matching}" ]; then
              echo "required CI check is missing for ${GITHUB_SHA}: ${required}" >&2
              exit 1
            fi
            if ! printf '%s\n' "${matching}" | awk -F '\t' '$2 == "completed" && $3 == "success" { found = 1 } END { exit(found ? 0 : 1) }'; then
              echo "required CI check did not complete successfully: ${required}" >&2
              printf '%s\n' "${matching}" >&2
              exit 1
            fi
          done

  build:
    name: Build ${{ matrix.component.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component:
          - name: backend
            dockerfile: backend/Dockerfile
            image: effchat-backend
          - name: web
            dockerfile: frontend/Dockerfile
            image: effchat-web
          - name: py-extractor
            dockerfile: py-extractor/Dockerfile
            image: effchat-py-extractor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ghcr.io/huoguojun123/${{ matrix.component.image }}
          tags: type=raw,value=staging-${{ github.sha }}
          flavor: latest=false
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: BUILD_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

  promote:
    name: Promote release manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote all images after successful builds
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_TAG: staging-${{ github.sha }}
        run: |
          set -euo pipefail
          for image in effchat-backend effchat-web effchat-py-extractor; do
            source="ghcr.io/huoguojun123/${image}:${SOURCE_TAG}"
            target="ghcr.io/huoguojun123/${image}:${RELEASE_TAG}"
            sha_target="ghcr.io/huoguojun123/${image}:sha-${GITHUB_SHA}"
            docker buildx imagetools create --tag "${target}" --tag "${sha_target}" "${source}"
          done

name: Release container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            dockerfile: backend/Dockerfile
            image: effchat-backend
          - name: web
            dockerfile: frontend/Dockerfile
            image: effchat-web
          - name: py-extractor
            dockerfile: py-extractor/Dockerfile
            image: effchat-py-extractor
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/huoguojun123/${{ matrix.component.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: BUILD_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
